services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${SBC_IP:-192.168.1.70}

  camera:
    build: ./services/camera
    container_name: camera
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - captures:/tmp/captures
    environment:
      PORT: 3001
      MEDIAMTX_RTSP_URL: rtsp://127.0.0.1:8554/canon
      NUXT_EVENTS_URL: http://127.0.0.1:3000/api/events/push
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      - mediamtx

  app:
    build: .
    container_name: app
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 3000
      CAMERA_SERVICE_URL: http://127.0.0.1:3001
      MEDIAMTX_WEBRTC_URL: http://127.0.0.1:8889
      CAMERA_API_URL: http://127.0.0.1:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      MOCK_CAMERA: ${MOCK_CAMERA:-false}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_LAT: ${WEATHER_LAT:-57.6261}
      WEATHER_LON: ${WEATHER_LON:-39.8845}
      LOCATION_NAME: ${LOCATION_NAME:-Yaroslavl}
      TIMEZONE_OFFSET: ${TIMEZONE_OFFSET:-3}
    depends_on:
      - camera

volumes:
  captures:
